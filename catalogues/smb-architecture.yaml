conflicts:
- id: F1
  title: How milestones reach tracking
  a:
    source: ref
    reference: §3.1 step 9
    statement: The reference says CWOM writes a milestone table and a database trigger feeds Felix. The
      SDD says CWOM publishes milestones per sub-order through TIBCO to BPM, after RTF's NotifyOrderCreationRequest.
      This catalogue follows the SDD.
  b:
    source: sdd
    reference: §BPM; §TIBCO
    statement: The reference says CWOM writes a milestone table and a database trigger feeds Felix. The
      SDD says CWOM publishes milestones per sub-order through TIBCO to BPM, after RTF's NotifyOrderCreationRequest.
      This catalogue follows the SDD.
  scope:
  - product: business-pro-plus
  difference: The reference says CWOM writes a milestone table and a database trigger feeds Felix. The
    SDD says CWOM publishes milestones per sub-order through TIBCO to BPM, after RTF's NotifyOrderCreationRequest.
    This catalogue follows the SDD.
- id: F2
  title: IBM BPM and Felix overlap
  a:
    source: ref
    reference: §1 IBM BPM, Felix
    statement: Both are described as holding order milestones for tracking. The SDD reads them as BPM
      using a Felix stored procedure.
  b:
    source: sdd
    reference: §BPM General Note
    statement: Both are described as holding order milestones for tracking. The SDD reads them as BPM
      using a Felix stored procedure.
  scope:
  - product: business-pro-plus
  difference: Both are described as holding order milestones for tracking. The SDD reads them as BPM using
    a Felix stored procedure.
- id: F13
  title: Names that differ between sources
  a:
    source: ref
    reference: §1; §6
    statement: eVEDA / vEDA, WFM / WFMS, B2B Web / B2B, CBCM / CRMGW. Treated as aliases of one system.
  b:
    source: sdd
    reference: Stakeholders
    statement: eVEDA / vEDA, WFM / WFMS, B2B Web / B2B, CBCM / CRMGW. Treated as aliases of one system.
  scope:
  - product: business-pro-plus
  difference: eVEDA / vEDA, WFM / WFMS, B2B Web / B2B, CBCM / CRMGW. Treated as aliases of one system.
- id: F16
  title: Who loads the basket for dunning
  a:
    source: sdd
    reference: §P3 ADO 259162, solution overview and CWOM section
    statement: For BAR_OG, NPTOSS, RECONNP and CESSNP, NPS (overview) or RTF (CWOM section) checks NEW_BUNDLE_MODEL,
      loads the basket from the CRMGW registry and adds the summary-order flags before CWOM.
  b:
    source: sdd
    reference: General Highlights; §P3 ADO 259162 note
    statement: 'RTF won''t load the basket for dunning: CWOM uses its existing registry until it is retired.'
  scope:
  - product: business-pro-plus
    order_types:
    - DUNNING
  difference: Whether dunning orders reach CWOM with a basket loaded from CRMGW, and by NPS or RTF. The
    journey follows the General Highlights and marks those steps inferred.
- id: F17
  title: What CRMGW returns as FPC_SITE for FortiPortal SSO
  a:
    source: sdd
    reference: Solution overview; General Highlights (ADO 194831)
    statement: FPC_SITE is sent empty in the SSO assertion.
  b:
    source: sdd
    reference: §CRMGW ADO 194831
    statement: FPC_SITE carries every site name with an active Self Service Portal subscription, comma-separated,
      for the organisation's party IDs.
  scope:
  - product: business-pro-plus
  difference: Whether the B2B portal's SSO to FortiPortal scopes the user to sites. CRMGW and B2B are
    to agree the attributes.
