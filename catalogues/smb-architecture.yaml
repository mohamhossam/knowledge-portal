  - id: R7
    statement: 'An add-on can be added only when its service type''s sub-order is closed: voice needs
      GSM; static IP and Speed Booster need GSM and GPON; SaaS needs GSM and SaaS; vSaaS needs GSM and
      vSaaS.'
    kind: dependency
    confidence: confirmed
    source: SDD v2.3 · §P4 Pending Order Validation, add-on matrix
  - id: R8
    statement: Amendment and cancellation are allowed until the point of no return agreed in the workflows.
      There is no amendment from the SMB App.
    kind: lifecycle
    confidence: confirmed
    source: SDD v2.3 · §P1 Amendment/Cancellation; §P2 UpDowngrade
  - id: R9
    statement: Dunning throttles Backup 5G to 5 Mbps with IN offer 854 at TOSS, and removes it at reconnect.
    kind: billing
    confidence: confirmed
    source: SDD v2.3 · §P3 ADO 259162
  - id: R10
    statement: 'The new generic CPE rate plan for 90G/120G carries an exit charge of AED 650 (to be confirmed
      by the business), per contract period: no contract, 1 year, 2 years.'
    kind: billing
    confidence: confirmed
    source: SDD v2.3 · §ADO 438907, US 438909
  - id: R11
    statement: The 900/450 speed profile is not offered on the Fortinet 90G until it passes the lab test.
    kind: composition
    confidence: confirmed
    source: SDD v2.3 · General Highlights, Speed Booster
  - id: R12
    statement: 'Backup 5G changes IN only when the bundle has it. New activation and migration: UpdateOffer
      for the base offer (6980) and the bandwidth offer. Cessation: DeleteOffer for both. Up/downgrade:
      added as in activation, removed as in cessation, kept by swapping the bandwidth offer, absent nothing.
      External shift: runPAM resets the geo-lock. Dunning: offer 854 at TOSS, removed at reconnect.'
    kind: fulfilment
    confidence: confirmed
    source: SDD v2.3 · §P4 Enhancement 1873844
  - id: R13
    statement: For an up/downgrade ECM suggests the Fortinet 90G or 120G (FAP-23JF-E or FAP-431F-E) below
      1 Gbps, so the CPE changes only when the target plan needs another model; at 1 Gbps only the 120G
      and FAP-431F-E.
    kind: fulfilment
    confidence: confirmed
    source: SDD v2.3 · §P4 Enhancement 1871663
  - id: R14
    statement: 'A device added during faulty device replacement carries its charge add-on PO: Fortinet 90G
      AED 13,200 and Fortinet 120G AED 18,000, one-time.'
    kind: billing
    confidence: confirmed
    source: SDD v2.3 · §ADO 438907, US 438912
  - id: R15
    statement: The CPE exit charge applies to cessation and to up/downgrade when the removed CPE's rate
      plan is still within its 1- or 2-year commitment.
    kind: billing
    confidence: inferred
    source: SDD v2.3 · §ADO 438907, US 438909 · The applicable SRs are stated; the commitment test follows
      the existing exit-charge rules.
  - id: R16
    statement: At the end of the contract, EHS moves the account to the non-commitment package of the same
      family (ccat_after_contract_migrate_plan) as an up/downgrade; from an old-model bundle, RTF copies
      the dynamic attributes to the new-model target.
    kind: lifecycle
    confidence: confirmed
    source: SDD v2.3 · §P4 ADO 420619
  - id: R17
    statement: A migration from a legacy product keeps the existing contract-reset and exit-charge rules
      on the removed devices.
    kind: billing
    confidence: confirmed
    source: SDD v2.3 · Feasibility US 202815, 202817
  - id: R18
    statement: 'Cessation is blocked while the activation is in progress: the customer cancels it first,
      each sub-order up to its point of no return, and the cessation then ceases what was fulfilled.'
    kind: lifecycle
    confidence: confirmed
    source: SDD v2.3 · §P4 ADO 288752
  - id: R19
    statement: Port-out is fulfilled as a cessation without Churn & Exit retention; port-in raises the port
      request at master-order level, before the split.
    kind: lifecycle
    confidence: confirmed
    source: SDD v2.3 · §P3 ADO 202826; §ADO 470510
  - id: R20
    statement: The FortiPortal organisation is created with the customer's first site and removed only with
      the last one.
    kind: lifecycle
    confidence: confirmed
    source: SDD v2.3 · §P1 FortiPortal Access; §P2 ADO 259161
journeys:
- id: bpp-new-activation
  name: New activation
  product: business-pro-plus
  order_type: NEW
  description: 'From the order in any channel to a closed order: the channel captures it, RTF evaluates
    it, CWOM splits it into sub-orders and fulfils them in parallel.'
  confidence: confirmed
  source: SMB reference v1.0 · §3.1; SDD v2.3 · §P1
  activities:
  - number: '10'
    name: Browse and configure the bundle
    description: Offers come from the local BCC catalogue, configured for the new Business Pro Plus POs.
    etom: Fulfillment · Selling
    channels:
    - b2b-web
    - smb-app
    channel_entry: true
    role: CAPTURE
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 1
  - number: '20'
    name: Map the offer to PSM package codes and the ECM structure
    system: bcc
    etom: Fulfillment · Selling
    channels:
    - b2b-web
    - smb-app
    role: CATALOG
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 2
  - number: '30'
    name: Add the bundle to the cart
    output: Customer migrated to NC Digital?
    etom: Fulfillment · Selling
    channels:
    - b2b-web
    - smb-app
    channel_entry: true
    role: CAPTURE
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 3
  - number: '40'
    name: Return customer, account and product data
    system: cbcm
    etom: Fulfillment · Order Handling
    channels:
    - b2b-web
    - smb-app
    role: CUSTOMER_DATA
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 4
  - number: '50'
    name: Return customer, organisation, contact and site data
    track: BRANCH-NCCRM
    system: nc-crm
    description: Other entities still come from CRMGW.
    etom: Fulfillment · Order Handling
    channels:
    - b2b-web
    - smb-app
    role: CUSTOMER_DATA
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 4 branch
  - number: '200'
    name: Capture the order from the bundle definition
    description: The new PO-modelling flag in the bundle definition decides the summary-order flags.
    etom: Fulfillment · Selling
    channels:
    - bcrm
    channel_entry: true
    role: CAPTURE
    confidence: confirmed
    source: 'SDD v2.3 · §P1 Legacy Migration (as for SMB FW: Order to Delivery)'
  - number: '210'
    name: Return customer and account data
    system: cbcm
    etom: Fulfillment · Order Handling
    channels:
    - bcrm
    role: CUSTOMER_DATA
    confidence: confirmed
    source: SMB reference v1.0 · §1 BCRM integrations
  - number: '300'
    name: Submit the order with the summary-order flags
    etom: Fulfillment · Order Handling
    channel_entry: true
    role: CAPTURE
    confidence: confirmed
    source: SDD v2.3 · §P1 New Activation (channels pass the Summary Order Flag)
  - number: '310'
    name: Announce the new order for tracking
    system: rtf
    description: RTF sends NotifyOrderCreationRequest through TIBCO to BPM, which opens the order tracker.
    etom: Fulfillment · Order Handling
    role: TRACK
    confidence: confirmed
    source: SDD v2.3 · §BPM; §TIBCO (Order Tracking)
  - number: '320'
    name: Build the value order and evaluate it
    system: rtf
    description: RTF translates the order to an RTF value order with PSM codes and evaluates it with CRMGW
      and ECM.
    output: Business rules passed?
    etom: Fulfillment · Order Handling
    role: VALIDATE
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 6
  - number: '330'
    name: Order returned for correction
    track: CORRECTION
    channel_entry: true
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 7
  - number: '340'
    name: Hand the order to CWOM
    system: rtf
    description: In Ericsson Order Care format, as a summary order (SUMMARY_ORDER / DETAILED_ORDER flags).
    etom: Fulfillment · Order Handling
    role: ORCHESTRATE
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 7
  - number: '350'
    name: Validate against ECM and accept the order
    system: cwom
    description: CWOM accepts the new platform type “Fortinet HE” and the new POs.
    etom: Fulfillment · Order Handling
    role: ORCHESTRATE
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 8
  - number: '360'
    name: Suggest the CPE and access-point models
    system: ecm
    description: 'Below 1 Gbps: Fortinet 90G and FAP-23JF-E. At 1 Gbps: Fortinet 120G and FAP-431F-E.'
    etom: Fulfillment · Service Configuration & Activation
    role: CATALOG
    confidence: confirmed
    source: SDD v2.3 · §P1.1 Generic FortiAP Offer
  - number: '370'
    name: Split into sub-orders
    system: cwom
    description: GPON; GSM (Backup 5G, UCaaS, synchronous SaaS); SaaS (asynchronous); vSaaS; and the master
      order.
    etom: Fulfillment · Service Configuration & Activation
    role: ORCHESTRATE
    confidence: inferred
    source: SDD v2.3 · §P4 Pending Order Validation · The sub-orders are named in the validation matrix;
      the split as a step is this catalogue's reading.
  - number: '380'
    name: Provision the CPE in the ADOM cluster; create the FortiPortal organisation
    track: PARALLEL-CPE
    system: e2eso
    description: The organisation is created once, with the customer's first site. CWOM passes the site
      name and organisation name.
    etom: Fulfillment · Service Configuration & Activation
    role: ACTIVATE
    confidence: confirmed
    source: SDD v2.3 · §P1 New Activation; §P2 New Activation
  - number: '390'
    name: Register the CPE and the organisation
    track: PARALLEL-CPE
    system: fortinet
    etom: Fulfillment · Supplier/Partner Requisition Management
    role: ACTIVATE
    confidence: confirmed
    source: SDD v2.3 · §P1 FortiPortal Access
  - number: '400'
    name: Install the CPE and FortiAP; capture SIC codes and serials
    track: PARALLEL-INSTALL
    system: wfms
    description: The technician sees the SIC code; WFMS updates CWOM with the AP's SIC code and serial.
      A faulty FortiAP can be replaced on site.
    etom: Fulfillment · Resource Provisioning
    role: FIELD
    confidence: confirmed
    source: SDD v2.3 · §P1 New Activation; §P1.1 Generic FortiAP Offer
  - number: '405'
    name: Check the bundle for Backup 5G
    track: PARALLEL-BACKUP
    system: cwom
    description: Backup 5G is a GSM sub-order component; without it the GSM sub-order carries only UCaaS
      and synchronous SaaS.
    output: Backup 5G in the bundle?
    etom: Fulfillment · Service Configuration & Activation
    role: ORCHESTRATE
    confidence: inferred
    source: SDD v2.3 · §P4 Enhancement 1873844 · The IN offers apply only when the bundle has Backup 5G;
      the check as a step is this catalogue's reading.
  - number: '410'
    name: Activate Backup 5G
    track: PARALLEL-BACKUP
    system: veda
    description: HSS profile 5GNSA_BPRO5GBKP; vEDA commands IN and Alepo. The SIM is geo-locked to cell
      IDs and the dongle's IMEI. A faulty 5G SIM can be replaced during installation (WFMS "Replace",
      CWOM to vEDA).
    etom: Fulfillment · Resource Provisioning
    role: ACTIVATE
    confidence: inferred
    source: SDD v2.3 · §P2 IN; §vEDA · The SDD details Backup 5G for up/downgrade and cessation and says
      activation is “the same as the new activation fulfillment”.
  - number: '420'
    name: Set the Backup 5G base and bandwidth offers
    track: PARALLEL-BACKUP
    system: in
    description: 'UpdateOffer twice: the base offer (PO_GSM_BACKUP_5G_UNL, IN offer 6980, SERVICE_TYPE
      BASE) and the bandwidth offer for the GPON speed (Business Pro+: 862, 864, 866, 869, 872, 874).'
    etom: Fulfillment · Resource Provisioning
    role: ACTIVATE
    confidence: confirmed
    source: SDD v2.3 · §P4 Enhancement 1873844 (New Activation/Migration)
  - number: '430'
    name: Activate SaaS services
    track: PARALLEL-SAAS
    system: xaas
    etom: Fulfillment · Service Configuration & Activation
    point_of_no_return: The XaaS callback is the point of no return for the asynchronous SaaS order.
    role: ACTIVATE
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 11
  - number: '440'
    name: Ship managed devices
    track: PARALLEL-SHIP
    system: itsm
    description: Shipment order from CWOM; the shipment confirmation comes back through TIBCO to a CWOM
      callback.
    etom: Fulfillment · Supplier/Partner Requisition Management
    point_of_no_return: For managed devices, the MDVC callback from HPSM is the point of no return.
    role: LOGISTICS
    confidence: confirmed
    source: SDD v2.3 · §TIBCO; §P4 Cancel Order Changes
  - number: '450'
    name: Receive the SD-WAN onboarding ticket
    track: PARALLEL-ONBOARD
    description: SD-WAN configuration is Day-N; activation doesn't wait for it.
    etom: Fulfillment · Service Configuration & Activation
    performer: MSS team
    role: FIELD
    confidence: confirmed
    source: SDD v2.3 · §P1 New Activation; General Highlights
  - number: '460'
    name: Start billing
    track: PARALLEL-BILL
    system: bscs
    description: The CPE rate plan follows the contract period chosen at capture (no contract, 1 year, 2
      years); a commitment carries an exit charge of AED 650.
    etom: Billing · Billing & Revenue Management
    role: BILL
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 12; SDD v2.3 · §ADO 438907 US 438909
  - number: '470'
    name: Send the order-completed SMS and email
    track: PARALLEL-BILL
    system: cns
    description: Template-driven, in English or Arabic. RTF also triggers the order-submitted and order-completed
