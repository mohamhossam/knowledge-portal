  - name: FortiPortal
    description: Provisioned only for Business Pro Plus accounts (self-service CFSS). The organisation
      is created with the first site and removed with the last branch's cessation.
    confidence: confirmed
    source: SDD v2.3 · §P1 FortiPortal Access
  tracking:
    scope_note: 'What happens inside when an order is created and when the customer or the back office
      opens its tracker: RTF announces it, CWOM publishes milestones per sub-order through TIBCO to BPM,
      and channels read them back.'
    channels:
    - channel: b2b-web
      correlation_key: Digital Order ID ↔ CWOM Order ID, per basket item
      read_system: tibco
      read_interface: getRealTimeOrderDetails
      confidence: confirmed
      source: SMB reference v1.0 · §3.1 step 10
    - channel: smb-app
      correlation_key: Digital Order ID ↔ CWOM Order ID, per basket item
      read_system: tibco
      read_interface: getRealTimeOrderDetails
      confidence: confirmed
      source: SMB reference v1.0 · §3.1 step 10
    - channel: bcrm
      correlation_key: BCRM Order ID ↔ CWOM Order ID
      confidence: confirmed
      source: SMB reference v1.0 · §3.1 step 10
    milestones:
    - label: Order created
      detail: RTF's NotifyOrderCreationRequest opens the tracker.
      system: rtf
      confidence: confirmed
      source: SDD v2.3 · §BPM
    - label: Sub-order milestones
      detail: The AS-IS New Activation milestones, per sub-order (GPON, GSM, SaaS, vSaaS); also posted
        for lifecycle orders.
      system: cwom
      confidence: confirmed
      source: SDD v2.3 · §BPM; §TIBCO
    - label: Device delivered
      detail: HPSM's shipment confirmation.
      system: itsm
      confidence: confirmed
      source: SDD v2.3 · §TIBCO
    fallout:
    - trigger: Stale or incomplete status
      handling: Tracking can show a stale status if CWOM fails to send a milestone or it isn't captured.
      confidence: confirmed
      source: SMB reference v1.0 · §5 Known Issues
    - trigger: Deleted items aren't tracked
      handling: BPM doesn't track order items with type DELETE on MIGRATE or UPDOWNGRD orders.
      confidence: confirmed
      source: SDD v2.3 · §BPM General Note
  sources:
  - sdd
  - ref
  primary_source: sdd
  questions:
  - id: F3
    text: 'RTF → CWOM call for new activation: The reference says only “CWOM format”. The SDD names createShoppingCart
      and refreshShoppingCart for migration and up/downgrade.'
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 7
  - id: F4
    text: 'Workflows and points of no return: The SDD''s workflow annex (WF-1 to WF-7) and PONR definitions
      are “yet to be provided”.'
    confidence: confirmed
    source: 'SDD v2.3 · Annexure: Workflows'
  - id: F5
    text: 'E2ESO technical proposal and interface agreement: Both annexes are empty, so the CWOM ↔ E2ESO
      calls are known by purpose only.'
    confidence: confirmed
    source: 'SDD v2.3 · Annexure: E2ESO TP, IAD'
  - id: F6
    text: 'Integration style and timing: Most calls don''t say whether they are REST, SOAP or messages,
      or whether they are synchronous.'
    confidence: confirmed
    source: SDD v2.3 · Throughout
  - id: F7
    text: 'Plan prices: Neither source states the plans'' prices. The only amount is the 90G/120G CPE
      exit charge, AED 650, to be confirmed.'
    confidence: confirmed
    source: SDD v2.3 · §ADO 438907
  - id: F8
    text: 'Device codes: SIC codes and some models of the 90G, 120G and FortiAP are TBD.'
    confidence: confirmed
    source: SDD v2.3 · §P1 Catalog Modelling
  - id: F9
    text: 'Milestone names: No milestone dictionary in either source.'
    confidence: confirmed
    source: SDD v2.3 · §BPM
  - id: F10
    text: 'MSS ticketing system: The system that carries the SD-WAN onboarding ticket isn''t named.'
    confidence: confirmed
    source: SDD v2.3 · §P1 New Activation
  - id: F11
    text: 'Names used but not defined: CPP, ODS (DWH), Bid Mgmt, PM tool and “Billing” are named as integrations
      but not described as systems.'
    confidence: confirmed
    source: SMB reference v1.0 · §1; §5
  - id: F12
    text: 'Who starts dunning: The SDD details the fulfilment of TOSS, reconnect and CESSNP but not the
      system that raises them.'
    confidence: confirmed
    source: SDD v2.3 · §P3 ADO 259162
  - id: F14
    text: 'Section references: The reference''s rules point to Section 4 for process flows; they are in
      Section 3.'
    confidence: confirmed
    source: SMB reference v1.0 · §0 Rules
  - id: F15
    text: 'SDD version: The cover says version 2.2; the revision history goes to 2.3 (11/09/2026), and
      2.2''s date is incomplete.'
    confidence: confirmed
    source: SDD v2.3 · Cover; Revision History
