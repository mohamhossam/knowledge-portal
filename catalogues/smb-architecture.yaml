  business_rules:
  - id: R1
    statement: 'SD-WAN/FortiPortal, Firewall, Static IP and Proactive Monitoring are mandatory: checked
      by default and locked in the Automation Portal for Business Pro Plus bundles.'
    kind: composition
    confidence: confirmed
    source: SDD v2.3 · §P1.1 Mandating Bundling Components
  - id: R2
    statement: Speed profiles with an upload:download ratio of 1:2 are only for Business Pro Plus; the
      1:10 profiles stay with Business Pro.
    kind: composition
    confidence: confirmed
    source: SDD v2.3 · §P1 Bundle Definition
  - id: R3
    statement: ECM suggests the Fortinet 90G below 1 Gbps and the 120G at 1 Gbps; FAP-23JF-E below 1 Gbps
      and FAP-431F-E from 1 Gbps.
    kind: fulfilment
    confidence: confirmed
    source: SDD v2.3 · §P1.1 Generic FortiAP Offer
