  values:
  - name: Secure by default
    description: Firewall, static IP, SD-WAN/FortiPortal and proactive monitoring are mandatory in every
      Business Pro Plus bundle, on Fortinet 90G or 120G CPEs.
    confidence: confirmed
    source: SDD v2.3 · §P1.1 Mandating Bundling Components; General Highlights
  - name: Multi-branch networking
    description: SD-WAN with IPSec tunnels between branches and hub/spoke set-up, managed from FortiPortal.
      Overlay and routing configuration is a Day-N service by the MSS team.
    confidence: confirmed
    source: SDD v2.3 · Feasibility matrix, User Story 57539; General Highlights
  - name: Business continuity
    description: 'Optional Backup 5G: traffic fails over to the 5G network when the fibre link goes down,
      and back when it returns.'
    confidence: confirmed
    source: SDD v2.3 · Feasibility matrix, User Story 80255 (existing implementation)
  - name: Self-management
    description: The customer opens FortiPortal from B2B Web or the SMB App by single sign-on, with a
      role that follows their B2B role.
    confidence: confirmed
    source: SDD v2.3 · §P3 ADO 194831
  - name: Managed Wi-Fi
    description: A managed FortiAP access point, boxed and serialised, delivered with the CPE.
    confidence: confirmed
    source: SDD v2.3 · Feasibility matrix, User Story 81960
  - name: Network visibility
    description: Bandwidth, latency and tunnel dashboards and reports in FortiPortal. Subject to Fortinet
      feasibility (TBD in the SDD).
    confidence: inferred
    source: SDD v2.3 · Feasibility matrix, User Story 81220 · Feasibility is TBD in the SDD.
  audiences:
  - name: Segment
    description: SMB customers (Enterprise › Fixed › SMB).
    confidence: inferred
    source: SMB reference v1.0 · Title and scope · The SDD doesn't state a customer-type rule.
  - name: New activation
    description: Sold through BCRM, B2B Web and the SMB App.
    confidence: confirmed
    source: SDD v2.3 · §P1 Applicable Channels
  - name: Migration
    description: Existing customers on legacy products (DEL, PBX, BQS…) migrate through BCRM; Business
      Edge (BFV2) customers through BCRM or the SMB App.
    confidence: confirmed
    source: SDD v2.3 · Scope; §P3 ADO 202824
  - name: Location
    description: External shift only within the Etisalat area. Bitstream is out of scope.
    confidence: confirmed
    source: SDD v2.3 · Scope; Feasibility matrix
  - name: Commitment
    description: No contract, 1 year or 2 years; the CPE rate plan follows the contract period chosen.
