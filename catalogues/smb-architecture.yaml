    statement: SD-WAN configuration (overlay, routing, templates, security policies) is a Day-N service
      by the MSS team, not part of activation.
    kind: fulfilment
    confidence: confirmed
    source: SDD v2.3 · General Highlights
  - id: R6
    statement: A lifecycle request is accepted only when the sub-orders it depends on are complete (pending-order
      validation matrix in CRMGW). An up/downgrade needs the master order closed.
    kind: dependency
    confidence: confirmed
    source: SDD v2.3 · §P4 Pending Order Validation
  - id: R7
    statement: 'An add-on can be added only when its service type''s sub-order is closed: voice needs
      GSM; static IP and Speed Booster need GSM and GPON; SaaS needs GSM and SaaS; vSaaS needs GSM and
      vSaaS.'
    kind: dependency
    confidence: confirmed
    source: SDD v2.3 · §P4 Pending Order Validation, add-on matrix
  - id: R8
    statement: Amendment and cancellation are allowed until the point of no return agreed in the workflows.
      There is no amendment from the SMB App.
    kind: lifecycle
    confidence: confirmed
    source: SDD v2.3 · §P1 Amendment/Cancellation; §P2 UpDowngrade
  - id: R9
    statement: Dunning throttles Backup 5G to 5 Mbps with IN offer 854 at TOSS, and removes it at reconnect.
    kind: billing
    confidence: confirmed
    source: SDD v2.3 · §P3 ADO 259162
  - id: R10
    statement: 'The new generic CPE rate plan for 90G/120G carries an exit charge of AED 650 (to be confirmed
      by the business), per contract period: no contract, 1 year, 2 years.'
    kind: billing
    confidence: confirmed
    source: SDD v2.3 · §ADO 438907, US 438909
  - id: R11
    statement: The 900/450 speed profile is not offered on the Fortinet 90G until it passes the lab test.
    kind: composition
    confidence: confirmed
    source: SDD v2.3 · General Highlights, Speed Booster
journeys:
- id: bpp-new-activation
  name: New activation
  product: business-pro-plus
  order_type: NEW
  description: 'From the order in any channel to a closed order: the channel captures it, RTF evaluates
    it, CWOM splits it into sub-orders and fulfils them in parallel.'
  confidence: confirmed
  source: SMB reference v1.0 · §3.1; SDD v2.3 · §P1
  activities:
  - number: '10'
    name: Browse and configure the bundle
    description: Offers come from the local BCC catalogue, configured for the new Business Pro Plus POs.
    etom: Fulfillment · Selling
    channels:
    - b2b-web
    - smb-app
    channel_entry: true
    role: CAPTURE
    confidence: confirmed
    source: SMB reference v1.0 · §3.1 step 1
  - number: '20'
    name: Map the offer to PSM package codes and the ECM structure
    system: bcc
    etom: Fulfillment · Selling
