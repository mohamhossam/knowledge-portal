- id: business-pro-plus
  name: Business Pro Plus
  code: B. Pro+
  family: Business internet bundles
  proposition: 'The premium flavour of Business Pro: fibre (GPON) internet on Fortinet 90G/120G CPEs,
    with SD-WAN and FortiPortal, firewall, static IP, proactive monitoring, a managed FortiAP and optional
    Backup 5G.


    Gives a small or medium business a secure, managed business connection it can run itself: one premium
    bundle instead of separate internet, security and Wi-Fi products, delivered through the Summary Order
    Fulfillment of the SMB Framework (Order to Delivery).'
  confidence: confirmed
  source: SDD v2.3 · §Solution Overview P1
