products:
- id: business-pro-plus
  name: Business Pro Plus
  code: B. Pro+
  family: Business internet bundles
  proposition: 'The premium flavour of Business Pro: fibre (GPON) internet on Fortinet 90G/120G CPEs,
    with SD-WAN and FortiPortal, firewall, static IP, proactive monitoring, a managed FortiAP and optional
    Backup 5G.


    Gives a small or medium business a secure, managed business connection it can run itself: one premium
    bundle instead of separate internet, security and Wi-Fi products, delivered through the Summary Order
    Fulfillment of the SMB Framework (Order to Delivery).'
  confidence: confirmed
  source: SDD v2.3 · §Solution Overview P1
  order_types:
  - code: NEW
    name: New activation
    enabled: true
    description: A new Business Pro Plus subscription on a new or existing account. Delivered in drop
      P1.
    channels:
    - bcrm
    - b2b-web
    - smb-app
    confidence: confirmed
    source: SDD v2.3 · Scope; §P1
  - code: MIGRATE
    name: Migration to Business Pro Plus
    enabled: true
    description: From a legacy product (DEL, PBX, BQS…) or from Business Edge (BFV2). Legacy through BCRM
      (P1); Business Edge through BCRM and the SMB App (P3). Delivered in drop P1 / P3.
    channels:
    - bcrm
    - smb-app
    confidence: confirmed
    source: SDD v2.3 · Scope; §P1 Legacy Migration; §P3 ADO 202824
  - code: PORTIN
    name: Port in
    enabled: true
    description: A new activation that brings the customer's number from another operator. Delivered in
      drop P3.
    channels:
    - bcrm
    - b2b-web
    - smb-app
    - nps
    confidence: confirmed
    source: SDD v2.3 · §NPS Port In & Port Out
  - code: UPDOWNGRD
    name: Upgrade / downgrade
    enabled: true
    description: Change of plan between Business Pro Plus, Office Presence, Business ON and Business Pro,
      with or without a device change. 28 from/to paths across Business Pro Plus, Office Presence, Business
      ON and Business Pro; P3 adds device change. Delivered in drop P2 / P3.
    channels:
    - bcrm
    - smb-app
    confidence: confirmed
    source: SDD v2.3 · Scope; §P2 ADO 81197; §P3 ADO 81961
  - code: ADDDELETE
    name: Add / delete add-on
    enabled: true
    description: Static IP, Speed Booster, VSaaS, voice, SaaS, managed-device and other add-ons. VSaaS
      and static IP (P2); Speed Booster and add-ons while on 5G backup (P4). Delivered in drop P2 / P4.
    channels:
    - bcrm
    - b2b-web
    - smb-app
    confidence: confirmed
    source: SDD v2.3 · Scope
  - code: MODSUBS
    name: Modify subscription
    enabled: true
    description: SaaS service activation from the digital channel. Delivered in drop P4.
    channels:
    - b2b-web
    - smb-app
    confidence: confirmed
    source: SDD v2.3 · Scope, P4 SaaS activation (MODSUBS)
  - code: CHINTUSRN
    name: Change internet username
    enabled: true
    description: Delivered in drop P2 / P4.
    channels:
    - bcrm
    - b2b-web
    - smb-app
    confidence: confirmed
    source: SDD v2.3 · Scope
  - code: CHGPSWD
    name: Change password
    enabled: true
    description: Delivered in drop P2 / P4.
    channels:
    - bcrm
    - b2b-web
    - smb-app
    confidence: confirmed
    source: SDD v2.3 · Scope
  - code: CHGDOMN
    name: Change domain
    enabled: true
    description: Delivered in drop P4.
    channels:
    - bcrm
    - b2b-web
    - smb-app
    confidence: confirmed
