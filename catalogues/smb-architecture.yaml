    progress it is accepted only when the GSM sub-order is closed; otherwise it follows the existing implementation.
  confidence: confirmed
  source: SDD v2.3 · §P4 ADO 324568; §P4 Pending Order Validation
  activities:
  - number: '10'
    name: Capture the modify subscription request
    description: Channels place it as today; no impact on BCRM, B2B or the SMB App.
    etom: Fulfillment · Selling
    channel_entry: true
    role: CAPTURE
    source: SDD v2.3 · §P4 ADO 324568
    confidence: confirmed
  - number: '20'
    name: Submit it to RTF
    description: Existing structure, without the summary-order flags.
    etom: Fulfillment · Order Handling
    channel_entry: true
    role: CAPTURE
    source: SDD v2.3 · §P4 ADO 324568
    confidence: confirmed
  - number: '30'
    name: Check the pending activation (pending order validation)
    system: cbcm
    description: While the new activation's master order is open, CRMGW accepts this order only when the
      GSM sub-order is closed; otherwise RTF rejects it.
    output: Accepted?
    etom: Fulfillment · Order Handling
    role: VALIDATE
    source: SDD v2.3 · §P4 Pending Order Validation
    confidence: confirmed
  - number: '35'
    name: 'Order rejected: the activation isn''t far enough'
    track: REJECTED
    description: The channel tells the customer the order can be placed once the named sub-orders are
      closed.
    channel_entry: true
    role: CAPTURE
    confidence: inferred
    source: SDD v2.3 · §P4 Pending Order Validation · RTF rejects the request; how the channel shows it
      isn't stated.
  - number: '40'
    name: Hand it to CWOM
    system: rtf
    description: CWOM accepts it without the summary-order flags or a basket load from RTF/CRMGW.
    etom: Fulfillment · Order Handling
    role: ORCHESTRATE
    source: SDD v2.3 · §P4 ADO 324568
    confidence: confirmed
  - number: '50'
    name: Carry out the network actions, as today
    system: cwom
    description: The SDD keeps the existing implementation and doesn't name the network systems.
    etom: Fulfillment · Service Configuration & Activation
    role: ORCHESTRATE
    source: SDD v2.3 · §P4 ADO 324568
    confidence: confirmed
  - number: '55'
    name: Activate the SaaS service
    system: xaas
    etom: Fulfillment · Service Configuration & Activation
    point_of_no_return: The XaaS callback is the point of no return for the asynchronous SaaS order.
    role: ACTIVATE
    confidence: inferred
    source: SDD v2.3 · §P4 ADO 324568 · The SR is titled “SaaS Service activation”; the XaaS call follows
      the activation journey.
  - number: '60'
    name: Close the request
    system: cbcm
    description: CWOM and CRMGW close it even while the original activation is still in progress.
    etom: Fulfillment · Order Handling
    role: RECORD
    source: SDD v2.3 · §P4 ADO 324568
    confidence: confirmed
  flow_rules:
  - kind: decision
    from: '30'
    to: '35'
    condition: 'No'
  - kind: decision
    from: '30'
    to: '40'
    condition: 'Yes'
  integrations:
  - from: '20'
    to: '20'
    interface: RTF order request (MODSUBS)
    to_system: rtf
    purpose: Submit in the existing structure.
    style: XML request
    tmf_equivalent: TMF622 Product Ordering
    source: SDD v2.3 · §P4 ADO 324568
    confidence: confirmed
  - from: '30'
    to: '30'
    interface: evaluateOrder
    timing: Sync
    from_system: rtf
    to_system: cbcm
    purpose: 'Validate the order against the pending-order matrix (MODSUBS: the GSM sub-order).'
    style: API
    tmf_equivalent: TMF679 Product Offering Qualification
    source: SDD v2.3 · §P4 Pending Order Validation
    confidence: confirmed
  - from: '40'
    to: '40'
    interface: Order
    from_system: rtf
    to_system: cwom
    purpose: Submit as today.
    style: API
    source: SDD v2.3 · §P4 ADO 324568
    confidence: confirmed
  - from: '55'
    to: '55'
    interface: Activate SaaS
    timing: Async
    from_system: cwom
    to_system: xaas
    purpose: Activate the subscribed SaaS service.
    confidence: inferred
    source: SDD v2.3 · §P4 ADO 324568 · Read from the activation journey.
