- id: F1
  title: How milestones reach tracking
  a:
    source: ref
    reference: §3.1 step 9
    statement: The reference says CWOM writes a milestone table and a database trigger feeds Felix. The
      SDD says CWOM publishes milestones per sub-order through TIBCO to BPM, after RTF's NotifyOrderCreationRequest.
      This catalogue follows the SDD.
  b:
    source: sdd
    reference: §BPM; §TIBCO
    statement: The reference says CWOM writes a milestone table and a database trigger feeds Felix. The
      SDD says CWOM publishes milestones per sub-order through TIBCO to BPM, after RTF's NotifyOrderCreationRequest.
      This catalogue follows the SDD.
  scope:
  - product: business-pro-plus
  difference: The reference says CWOM writes a milestone table and a database trigger feeds Felix. The
    SDD says CWOM publishes milestones per sub-order through TIBCO to BPM, after RTF's NotifyOrderCreationRequest.
    This catalogue follows the SDD.
- id: F2
  title: IBM BPM and Felix overlap
  a:
    source: ref
    reference: §1 IBM BPM, Felix
    statement: Both are described as holding order milestones for tracking. The SDD reads them as BPM
      using a Felix stored procedure.
