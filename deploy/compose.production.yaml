# Reference deployment of the knowledge portal on its own: one host, every
# process in its own container, running the images a release published
# (requirement-portal ADR-0104). docs/operations/deployment.md covers secrets,
# scaling, connecting requirement work and moving data over.
#
#   cp deploy/production.env.example deploy/production.env   # then fill it in
#   export KNOWLEDGE_IMAGE_TAG=vX.Y.Z KNOWLEDGE_POSTGRES_PASSWORD=...
#   docker compose -f deploy/compose.production.yaml up -d
#
# The browser reaches only `edge` (port 8090; put TLS in front of it): the app at
# /knowledge/ and the API at /knowledge-api/. The API, worker, database,
# scanner and metrics ports stay on the private network, and /internal never
# passes the edge. Requirement work is optional: with REQUIREMENT_API_BASE_URL
# unset in production.env, the portal runs alone; deploy/compose.peer.yaml
# connects the two.

name: knowledge-portal

x-backend: &backend
  image: ghcr.io/mohamhossam/knowledge-api:${KNOWLEDGE_IMAGE_TAG:?set KNOWLEDGE_IMAGE_TAG to a knowledge-portal release}
  env_file:
    - path: production.env
      required: true
  environment: &backend-environment
    PERSISTENCE_PROVIDER: postgres
    DATABASE_URL: postgresql://knowledge:${KNOWLEDGE_POSTGRES_PASSWORD:?set KNOWLEDGE_POSTGRES_PASSWORD}@postgres:5432/smb_knowledge
    LIBRARY_SCAN_MODE: clamav
    LIBRARY_SCANNER_HOST: clamav
    LIBRARY_SCANNER_PORT: "3310"
    LOG_FORMAT: json
    METRICS_HOST: 0.0.0.0
    METRICS_PORT: "9464"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  # Model profiles: LLM_CONFIG_PATH=/app/config/llm.yaml in production.env.
  volumes:
    - type: bind
      source: ${KNOWLEDGE_LLM_CONFIG_DIR:-../config}
      target: /app/config
      read_only: true
      bind:
        create_host_path: false
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: smb_knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${KNOWLEDGE_POSTGRES_PASSWORD:?set KNOWLEDGE_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d smb_knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Library uploads are scanned before extraction. Loading signatures takes a
  # few minutes on first start; ingestion waits, the rest of the portal does not.
  clamav:
    image: clamav/clamav:1.5@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  # Schema changes run once, before the API and worker start, never on boot.
  migrate:
    <<: *backend
    command: ["python", "-m", "knowledge_portal.infrastructure.persistence.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command:
      - python
      - -m
      - knowledge_portal.interfaces.api.serve
      - --host=0.0.0.0
      - --port=8000
      - --forwarded-allow-ips=*
    environment:
      <<: *backend-environment
      # HTTP only; background work runs in `worker`.
      API_BACKGROUND_WORKERS: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Library ingestion and catalogue jobs. Leased in PostgreSQL, so it scales
  # with `--scale worker=N`.
  worker:
    <<: *backend
    command: ["python", "-m", "knowledge_portal.interfaces.worker"]
    stop_grace_period: 3m
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The browser app: nginx serving /knowledge/, from the same release as the API.
  # The issuer origins reach its page's Content-Security-Policy when it starts.
  web:
    image: ghcr.io/mohamhossam/knowledge-web:${KNOWLEDGE_IMAGE_TAG:?set KNOWLEDGE_IMAGE_TAG to a knowledge-portal release}
    environment:
      CSP_IDENTITY_ORIGINS: ${CSP_IDENTITY_ORIGINS:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  # The only published port: one origin for the app and its API.
  edge:
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af
    # KNOWLEDGE_PORT moves it off 8090.
    ports:
      - "${KNOWLEDGE_PORT:-8090}:8080"
    volumes:
      - type: bind
        source: ./edge/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./web/security-headers.conf
        target: /etc/nginx/snippets/security-headers.conf
        read_only: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  clamav_data:
