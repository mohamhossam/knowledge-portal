# The local stand-in for requirement-portal's edge proxy: one origin serving the
# browser app at /knowledge/ and the API at /knowledge-api/ (prefix stripped,
# as the Vite development proxy does). /internal is never routed.
server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 20m;

    location = / {
        return 302 /knowledge/;
    }

    location ^~ /knowledge-api/internal {
        return 404;
    }

    location /knowledge-api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
    }
}
