# The local stack's edge (compose.local.yaml): one origin for the browser, as
# requirement-portal's `web` gives the platform. /knowledge/ is the browser app
# (`web`), /knowledge-api/ the API with the prefix removed (`api`). Internal
# routes never pass, as in the platform's edge.

# /knowledge-api/library?x=1 -> /library?x=1, query string kept.
map $request_uri $api_request_uri {
    ~^/knowledge-api(?<api_path>/.*)$ $api_path;
}

server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    # An upload of DOCUMENT_MAX_FILE_BYTES (10 MiB) plus its form fields, as the
    # platform's edge allows; the API applies its own limits behind this.
    client_max_body_size 12m;

    # Docker's embedded DNS. Names in variables are resolved per request, so the
    # edge starts before the API and finds a recreated container again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:8080;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /knowledge/;
    }

    location = /knowledge {
        return 301 /knowledge/;
    }

    location ^~ /knowledge-api/internal {
        return 404;
    }

    location /knowledge-api/ {
        proxy_pass $api_upstream$api_request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Catalogue reading and impact previews can run for minutes on a slow model.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /knowledge/ {
        proxy_pass $web_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
