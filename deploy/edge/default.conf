# The portal's edge, in both compose.local.yaml and compose.production.yaml: one
# origin for the browser. /knowledge/ is the browser app (`web`), /knowledge-api/
# the API with the prefix removed (`api`). Internal routes never pass
# (requirement-portal ADR-0099); requirement work reaches them on a private
# network instead (deploy/compose.peer.yaml).

# /knowledge-api/library?x=1 -> /library?x=1, query string kept.
map $request_uri $api_request_uri {
    ~^/knowledge-api(?<api_path>/.*)$ $api_path;
}

server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    # An upload of DOCUMENT_MAX_FILE_BYTES (10 MiB) plus its form fields, as the
    # platform's edge allows; the API applies its own limits behind this.
    client_max_body_size 12m;

    # Docker's embedded DNS. Names in variables are resolved per request, so the
    # edge starts before the API and finds a recreated container again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:8080;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /knowledge/;
    }

    location = /knowledge {
        return 301 /knowledge/;
    }

    # A path that only normalises to /internal is caught too: the location match
    # runs on the decoded, merged path.
    location ^~ /knowledge-api/internal {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # `web` sets these headers on the app itself; the API's answers get them here.
    location /knowledge-api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $api_upstream$api_request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Catalogue reading and impact previews can run for minutes on a slow model.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /knowledge/ {
        proxy_pass $web_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
