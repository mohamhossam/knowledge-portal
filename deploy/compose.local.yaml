# The knowledge portal on one machine, for local trials: PostgreSQL, ClamAV, the
# migration, the API (fake models and fake sign-in), the browser app, and an edge
# proxy at http://localhost:8200/knowledge/. Production deployment belongs to
# requirement-portal; this file is not it.
#
# Build the images first (README "Images and releases"), tagged :local:
#   docker build --secret id=kernel_read_token,env=KERNEL_READ_TOKEN -f deploy/api/Dockerfile -t knowledge-portal/api:local .
#   docker build -f deploy/web/Dockerfile -t knowledge-portal/web:local .
# Then: docker compose -f deploy/compose.local.yaml up -d
# Optional sample data: python scripts/seed_demo.py --api http://localhost:8200/knowledge-api

name: knowledge-portal

x-api-env: &api-env
  APP_ENV: development
  LLM_PROVIDER: fake
  IDENTITY_PROVIDER: fake
  PERSISTENCE_PROVIDER: postgres
  DATABASE_URL: postgresql://smb:smb_dev@postgres:5432/smb_knowledge
  LIBRARY_SCAN_MODE: clamav
  LIBRARY_SCANNER_HOST: clamav
  LIBRARY_SCANNER_PORT: "3310"
  PRODUCT_CATALOG_PROVIDER: fake
  PROVIDER_RATE_LIMIT_PER_MINUTE: "0"

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: smb
      POSTGRES_PASSWORD: smb_dev
      POSTGRES_DB: smb_knowledge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smb -d smb_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    restart: unless-stopped
    image: clamav/clamav:1.5
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  migrate:
    image: knowledge-portal/api:local
    command: ["python", "-m", "knowledge_portal.infrastructure.persistence.migrate"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    restart: unless-stopped
    image: knowledge-portal/api:local
    command:
      - python
      - -m
      - knowledge_portal.interfaces.api.serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --forwarded-allow-ips
      - "*"
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    restart: unless-stopped
    image: knowledge-portal/web:local
    environment:
      CSP_IDENTITY_ORIGINS: ""

  edge:
    restart: unless-stopped
    image: nginx:1.27-alpine
    volumes:
      - ./local/edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8200:8080"
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  clamav-data:
