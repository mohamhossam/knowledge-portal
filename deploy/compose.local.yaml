# The knowledge portal on its own, every process in its own container, for
# trying it on one machine. Built from this checkout; START_GUIDE.md, section 7.
#
#   cp .env.example deploy/local.env
#   docker compose -f deploy/compose.local.yaml up -d --build
#   open http://localhost:8090/knowledge/
#
# The browser reaches only `edge` (127.0.0.1:8090): /knowledge/ is the browser
# app, /knowledge-api/ the API, and /internal never passes. Fake sign-in lets
# anyone who reaches the port act as any persona, so the port is published on
# loopback only. A shared deployment is deploy/compose.production.yaml, which
# runs the released images (requirement-portal ADR-0104).

name: knowledge-local

x-backend: &backend
  image: ${KNOWLEDGE_API_IMAGE:-knowledge-portal/api:local}
  build:
    context: ..
    dockerfile: deploy/api/Dockerfile
  # Everything else, such as the model provider and its key, comes from here.
  env_file:
    - path: local.env
      required: true
  environment: &backend-environment
    PERSISTENCE_PROVIDER: postgres
    DATABASE_URL: postgresql://knowledge:${KNOWLEDGE_POSTGRES_PASSWORD:-knowledge_dev}@postgres:5432/smb_knowledge
    LIBRARY_SCAN_MODE: clamav
    LIBRARY_SCANNER_HOST: clamav
    LIBRARY_SCANNER_PORT: "3310"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: smb_knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${KNOWLEDGE_POSTGRES_PASSWORD:-knowledge_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d smb_knowledge"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  # Schema changes run once, before the API and worker start, never on boot.
  migrate:
    <<: *backend
    command: ["python", "-m", "knowledge_portal.infrastructure.persistence.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command:
      - python
      - -m
      - knowledge_portal.interfaces.api.serve
      - --host=0.0.0.0
      - --port=8000
      - --forwarded-allow-ips=*
    environment:
      <<: *backend-environment
      # HTTP only; background work runs in `worker`.
      API_BACKGROUND_WORKERS: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Library ingestion and catalogue jobs, leased in PostgreSQL.
  worker:
    <<: *backend
    command: ["python", "-m", "knowledge_portal.interfaces.worker"]
    stop_grace_period: 3m
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The browser app: nginx serving /knowledge/, or KNOWLEDGE_BASE_PATH
  # (deploy/web/Dockerfile).
  web:
    image: ${KNOWLEDGE_WEB_IMAGE:-knowledge-portal/web:local}
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        KNOWLEDGE_BASE_PATH: ${KNOWLEDGE_BASE_PATH:-/knowledge/}
    environment:
      CSP_IDENTITY_ORIGINS: ""
      # Empty: no links to requirement work.
      REQUIREMENT_PORTAL_URL: ${REQUIREMENT_PORTAL_URL:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  edge:
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT:-8090}:8080"
    volumes:
      - type: bind
        source: ./edge/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./web/security-headers.conf
        target: /etc/nginx/snippets/security-headers.conf
        read_only: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  clamav_data:
