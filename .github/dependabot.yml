# Weekly dependency, base-image and action updates as reviewable pull requests,
# kept quiet as in requirement-portal (its ADR-0077):
# - minor and patch updates are grouped, one PR per ecosystem;
# - every Actions update is one grouped PR;
# - the Python version is upgraded deliberately, never as an image bump;
# - at most three open PRs per ecosystem.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/deploy/api]
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # The project runs Python 3.12 (pyproject, uv, CI). A newer interpreter is
      # a deliberate upgrade, not an image bump.
      - dependency-name: python
        versions: [">=3.13"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
