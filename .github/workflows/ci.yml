name: CI

on:
  # Only the default branch on push: a branch with an open pull request is
  # already covered by the pull_request trigger.
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowledge_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Read access to platform-kernel
        # The kernel is a private git dependency (requirement-portal ADR-0100).
        # The token is a fine-grained, read-only token for that one repository.
        env:
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
        run: |
          test -n "$KERNEL_READ_TOKEN" || { echo "KERNEL_READ_TOKEN secret is not set"; exit 1; }
          kernel="github.com/mohamhossam/platform-kernel"
          git config --global "url.https://x-access-token:${KERNEL_READ_TOKEN}@${kernel}.insteadOf" "https://${kernel}"

      - name: Install locked project
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: pytest with coverage
        # The floor lives in pyproject.toml ([tool.coverage.report] fail_under)
        # and is measured with PostgreSQL, as here.
        run: pytest --cov --cov-report=term

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src tests

      - name: lint-imports
        run: lint-imports

  frontend:
    # The browser app: lint, types, unit tests, the API types against the
    # published contract, and a production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: API types match the published contract
        run: npm run api:check
      - run: npm run build
      - name: Brand lint (colours only in the token layers)
        run: npm run lint:brand
      - name: Bundle budget (main chunk ≤ 110% of the Phase 0 baseline)
        run: npm run budget
      - name: npm dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Route accessibility (axe, WCAG 2.x A/AA, a ratchet on a11y-baseline.json)
    # and visual checks of redesigned routes, on the offline fake stack: the
    # API in memory with fake identity and LLM, seeded, and `vite preview`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Read access to platform-kernel
        # The same read-only token as the quality gates (requirement-portal ADR-0100).
        env:
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
        run: |
          test -n "$KERNEL_READ_TOKEN" || { echo "KERNEL_READ_TOKEN secret is not set"; exit 1; }
          kernel="github.com/mohamhossam/platform-kernel"
          git config --global "url.https://x-access-token:${KERNEL_READ_TOKEN}@${kernel}.insteadOf" "https://${kernel}"

      - name: Install locked project
        run: uv sync --locked --extra dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Playwright (a11y + visual) on the fake stack
        working-directory: frontend
        run: npm run e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
          retention-days: 14

  web-image:
    # Builds the knowledge-web image, scans it, and checks it serves /knowledge/.
    runs-on: ubuntu-latest
    env:
      IMAGE: knowledge-portal/web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: DOCKER_BUILDKIT=1 docker build -f deploy/web/Dockerfile -t "$IMAGE" .

      - name: Scan the image for fixable HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$IMAGE"

      - name: Serves the app under /knowledge/ on a read-only root
        run: |
          docker run -d --name web --read-only -p 8080:8080             --tmpfs /tmp:uid=101,gid=101 --tmpfs /etc/nginx/conf.d:uid=101,gid=101             -e CSP_IDENTITY_ORIGINS=https://login.example.test "$IMAGE"
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/knowledge/ | grep -q '<title>Knowledge portal</title>'
          curl -fsS http://127.0.0.1:8080/knowledge/library | grep -q 'http-equiv="Content-Security-Policy"'
          # The deployment's issuer reaches the policy; the placeholder never ships.
          curl -fsS http://127.0.0.1:8080/knowledge/ | grep -q 'connect-src .self. https://login.example.test'
          ! curl -fsS http://127.0.0.1:8080/knowledge/library | grep -q '__CSP_IDENTITY_ORIGINS__'
          curl -fsSI http://127.0.0.1:8080/knowledge/ | grep -i "frame-ancestors 'none'"
          asset=$(curl -fsS http://127.0.0.1:8080/knowledge/ | grep -o '/knowledge/assets/[^"]*\.js' | head -1)
          curl -fsSI "http://127.0.0.1:8080$asset" | grep -i "immutable"

  supply-chain:
    # Known-vulnerable dependencies fail the build. The audit covers what the
    # image ships (no dev tools), and the optional OCR stack an operator may add.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Python dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-package smb-platform-kernel --format requirements-txt > requirements.txt
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps -r requirements.txt

      - name: Python dependency audit (document-ocr extra)
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-package smb-platform-kernel --extra document-ocr --format requirements-txt > requirements-ocr.txt
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps -r requirements-ocr.txt

  image:
    # Builds the backend image, scans it, and starts it offline, so a broken
    # Dockerfile or entry point fails here rather than in a deployment.
    runs-on: ubuntu-latest
    env:
      IMAGE: knowledge-portal/api:ci
      # Passed to the build as a BuildKit secret, never as a build arg.
      KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: |
          test -n "$KERNEL_READ_TOKEN" || { echo "KERNEL_READ_TOKEN secret is not set"; exit 1; }
          DOCKER_BUILDKIT=1 docker build --secret id=kernel_read_token,env=KERNEL_READ_TOKEN \
            -f deploy/api/Dockerfile -t "$IMAGE" .

      - name: The token never reaches the image
        run: |
          ! docker history --no-trunc "$IMAGE" | grep -F "$KERNEL_READ_TOKEN"

      - name: Scan the image for fixable HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$IMAGE"

      - name: Every command starts
        run: |
          docker run --rm "$IMAGE" knowledge-portal import --help
          docker run --rm -e PERSISTENCE_PROVIDER=memory "$IMAGE" \
            python -m knowledge_portal.infrastructure.persistence.migrate
          docker run -d --name api -p 8000:8000 \
            -e LLM_PROVIDER=fake -e LIBRARY_SCAN_MODE=offline "$IMAGE"
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ready && exit 0
            sleep 1
          done
          docker logs api
          exit 1
