[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smb-knowledge-portal"
version = "0.1.0"
description = "Knowledge portal: the shared reference library, architecture catalogue and squad catalogue (ADR-0098)."
requires-python = ">=3.12"
dependencies = [
    # Shared mechanisms (ADR-0100), pinned by release tag; pip and uv both read this.
    "smb-platform-kernel @ git+https://github.com/mohamhossam/platform-kernel@v1.0.0",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "openai>=3.8,<4",
    "Pillow>=12.3,<13",
    "pydantic>=2.9,<3",
    "PyJWT[crypto]>=2.13,<2.14",
    "psycopg[binary,pool]>=3.2,<4",
    "pypdf>=6.16.1,<7",
    "pypdfium2>=4.30,<6",
    "python-multipart>=0.0.18,<1",
    "python-dotenv>=1.0,<2",
    "tokenizers>=0.21,<1",
    "PyYAML>=6,<7",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
document-ocr = ["docling>=2.50,<3"]
dev = [
    "import-linter>=2.1,<3",
    "mypy>=1.11,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.8,<1",
    "types-openpyxl>=3.1,<4",
    "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knowledge_portal.infrastructure.persistence" = ["migrations/*.sql"]
"knowledge_portal.infrastructure.architecture" = ["knowledge/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["knowledge_portal"]

[tool.coverage.report]
# Raised as the PostgreSQL adapters gain integration tests (Stage 3.3);
# requirement-portal holds 92.5%.
fail_under = 85
skip_covered = true
